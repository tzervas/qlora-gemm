[package]
name = "qlora-gemm"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Matrix multiplication algorithms - maintained fork using qlora-paste"
readme = "../README.md"
repository.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
raw-cpuid = { workspace = true }
seq-macro = { workspace = true }
dyn-stack = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
num-complex = { workspace = true, default-features = false }
qlora-paste = { workspace = true }

qlora-gemm-common = { version = "0.20.0", default-features = false, path = "../qlora-gemm-common" }
qlora-gemm-f32 = { version = "0.20.0", path = "../qlora-gemm-f32", default-features = false }
qlora-gemm-f64 = { version = "0.20.0", path = "../qlora-gemm-f64", default-features = false }
qlora-gemm-c32 = { version = "0.20.0", path = "../qlora-gemm-c32", default-features = false }
qlora-gemm-c64 = { version = "0.20.0", path = "../qlora-gemm-c64", default-features = false }

qlora-gemm-f16 = { version = "0.20.0", path = "../qlora-gemm-f16", default-features = false, optional = true }

[features]
default = ["std", "rayon", "f16"]
f16 = ["qlora-gemm-f16", "qlora-gemm-common/f16"]
std = [
  "dyn-stack/std",
  "qlora-gemm-common/std",
  "qlora-gemm-f32/std",
  "qlora-gemm-f64/std",
  "qlora-gemm-c32/std",
  "qlora-gemm-c64/std",
  "qlora-gemm-f16?/std",
]
x86-v4 = [
  "qlora-gemm-common/x86-v4",
  "qlora-gemm-f32/x86-v4",
  "qlora-gemm-f64/x86-v4",
  "qlora-gemm-c32/x86-v4",
  "qlora-gemm-c64/x86-v4",
  "qlora-gemm-f16?/x86-v4",
]
experimental-apple-amx = [
    "qlora-gemm-common/experimental-apple-amx",
    "qlora-gemm-f32/experimental-apple-amx",
    "qlora-gemm-f64/experimental-apple-amx",
    "qlora-gemm-c32/experimental-apple-amx",
    "qlora-gemm-c64/experimental-apple-amx",
    "qlora-gemm-f16?/experimental-apple-amx",
]
rayon = [
  "std",
  "qlora-gemm-common/rayon",
  "qlora-gemm-f32/rayon",
  "qlora-gemm-f64/rayon",
  "qlora-gemm-c32/rayon",
  "qlora-gemm-c64/rayon",
  "qlora-gemm-f16?/rayon",
]
wasm-simd128-enable = ["qlora-gemm-common/wasm-simd128-enable"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
nalgebra = "0.33.2"
assert_approx_eq = "1.1.0"
rand = "0.8.5"
# default features pull `plot` -> plotters -> font-kit -> yeslogic-fontconfig-sys,
# which needs system pkg-config + libfontconfig at build time. Coverage builds all
# dev-deps (`--workspace`), so that native chain broke CI on runners without those
# system libs. The bench uses no diol plotting API, so drop the `plot` feature.
diol = { version = "0.8.3", default-features = false }
clap = { version = "4.5.4", features = ["derive"] }
aligned-vec = "0.6.1"
itertools = "0.14.0"
regex = "1.10.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.2", features = ["js"] }


[[bench]]
name = "bench"
harness = false
