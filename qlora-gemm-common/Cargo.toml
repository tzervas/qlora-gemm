[package]
name = "qlora-gemm-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Common utilities for qlora-gemm matrix multiplication - maintained fork using qlora-paste"
readme = "../README.md"
repository.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
raw-cpuid = { workspace = true }
seq-macro = { workspace = true }
once_cell = { workspace = true, default-features = false, features = ["race", "alloc"] }
dyn-stack = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
num-complex = { workspace = true, default-features = false }
half = { workspace = true, default-features = false, optional = true }
rayon = { workspace = true, optional = true }
qlora-paste = { workspace = true }
pulp = { version = "0.22.0", default-features = false }
bytemuck = "1.14"
libm = "0.2.11"

[target.'cfg(target_vendor = "apple")'.dependencies]
sysctl = { workspace = true, optional = true }

[features]
default = [
  "std",
  "rayon",
  "f16",
]
std = ["pulp/std", "dyn-stack/std", "once_cell/std", "sysctl"]
x86-v4 = ["pulp/x86-v4"]
wasm-simd128-enable = []
experimental-apple-amx = ["std"]
rayon = ["dep:rayon", "std"]
f16 = ["half"]
